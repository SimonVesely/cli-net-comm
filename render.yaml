services:
  - type: web
    name: cli-net-comm-relay
    runtime: rust
    plan: free
    region: frankfurt
    buildCommand: cargo build --release -p relay
    startCommand: ./target/release/relay
    healthCheckPath: /healthz
    envVars:
      - key: TRUST_PROXY
        value: "true"
      - key: PUBLIC_USERS
        value: "false"
    buildFilter:
      paths:
        - relay/**
        - Cargo.toml
        - Cargo.lock
